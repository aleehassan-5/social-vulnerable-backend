services:
  - type: web
    name: synergy-backend
    env: node
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma db push --skip-generate && node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLIENT_URL
        value: https://your-frontend.vercel.app
      - key: PORT
        value: 10000

# ℹ️ Database is on Neon (managed externally)
# DATABASE_URL must be set manually in Render Environment Variables
# Use POOLED connection from Neon (with -pooler in URL)
