services:
  - type: web
    name: synergy-backend
    env: node
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma db push --skip-generate && node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: synergy-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: https://your-frontend.vercel.app
      - key: PORT
        value: 10000

databases:
  - name: synergy-db
    databaseName: synergy_social
    user: synergy
